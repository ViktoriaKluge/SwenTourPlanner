<button
  class="tour-card"
  [class.active]="active"
  type="button"
  (click)="choose()"
>
  <div class="card-top">
    <div class="card-icon transport-{{ tour.transportType }}">{{ meta.icon }}</div>
    <div class="card-badges">
      @if (tour.favorite) {
        <span class="favorite-chip" aria-label="Favorit">★</span>
      }
      @if (tour.accessible) {
        <span class="card-tag accessible-tag" aria-label="Barrierefrei">♿ Barrierefrei</span>
      }
      <span class="card-tag transport-{{ tour.transportType }}">{{ meta.label }}</span>
    </div>
  </div>

  <div class="card-title">{{ tour.title }}</div>

  @if (tour.description) {
    <div class="card-desc">{{ tour.description }}</div>
  }

  <div class="card-stats">
    <span class="card-stat">{{ tour.route.distance }} km</span>
    <span class="card-stat">{{ tour.route.durationMin }} Min.</span>
    <span class="card-stat">{{ tour.logs.length }} {{ tour.logs.length === 1 ? 'Log' : 'Logs' }}</span>
  </div>

  @if (matchedLogCount > 0) {
    <div class="log-match-hint">📓 Treffer in {{ matchedLogCount }} {{ matchedLogCount === 1 ? 'Log' : 'Logs' }}</div>
  }
</button>
