<div class="tour-list">
  @if (tours().length === 0) {
    <div class="empty-state">
      <span class="empty-icon">🗺</span>
      <p>Keine Touren gefunden.</p>
    </div>
  } @else {
    <div class="list-items">
      @for (tour of tours(); track tour.id) {
        <app-tour-card
          [tour]="tour"
          [active]="selectedId() === tour.id"
          (select)="onSelect($event)"
        />
      }
    </div>

    <!-- Infinite scroll sentinel -->
    @if (hasMore()) {
      <div #sentinel class="sentinel" aria-hidden="true">
        <span class="loading-dots">
          <span></span><span></span><span></span>
        </span>
      </div>
    } @else {
      <!-- Non-visible sentinel so observer always has an element -->
      <div #sentinel class="sentinel-hidden" aria-hidden="true"></div>
    }
  }
</div>
