<div class="tour-list">
  @if (tours().length === 0) {
    <div class="empty-state">
      <span class="empty-icon">🗺</span>
      <p>Keine Touren gefunden.</p>
    </div>
  } @else {
    <div class="list-items">
      @for (tour of tours(); track tour.id) {
        <app-tour-card
          [tour]="tour"
          [active]="selectedId() === tour.id"
          (select)="onSelect($event)"
        />
      }
    </div>

    <!-- Infinite scroll sentinel – always in DOM so @ViewChild(static:true) finds it -->
    <div #sentinel class="sentinel-wrapper" aria-hidden="true">
      @if (hasMore()) {
        <span class="loading-dots"><span></span><span></span><span></span></span>
      }
    </div>
  }
</div>
