<div class="content-container">
  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="login()">
    <h2>{{ registerMode ? 'Registrieren' : 'Login' }}</h2>

    <div class="form-group">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        formControlName="username"
        placeholder="Dein Username"
        [disabled]="busy()"
        required
      />

    </div>

    <div class="form-group">
      <label for="password">Passwort</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        placeholder="Dein Passwort"
        [disabled]="busy()"
        required
      />
    </div>

    @if (error) {
      <p class="form-error">{{ error }}</p>
    }

    <button type="submit" class="login-btn" [disabled]="busy()">
      @if (busy()) {
        <span class="spinner" aria-hidden="true"></span>
        {{ registerMode ? 'Account wird erstellt...' : 'Anmeldung läuft...' }}
      } @else {
        {{ registerMode ? 'Account erstellen' : 'Anmelden' }}
      }
    </button>

    <p class="forgot-password">
      <a href="#" [class.disabled-link]="busy()" (click)="$event.preventDefault(); toggleMode()">
        {{ registerMode ? 'Schon registriert? Zum Login' : 'Noch kein Account? Registrieren' }}
      </a>
    </p>

  </form>
</div>
